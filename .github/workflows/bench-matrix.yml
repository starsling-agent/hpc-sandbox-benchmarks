name: CPU benchmark

# One frozen experiment, dispatched as TWO provider matrices:
#
#   plan  ->  synthetic (one job per provider)  ->  realworld (one job per provider)  ->  publish
#
# Each wave job runs every cell of that wave for its provider in ONE job, holding at most the
# account's sandbox cap at a time and refilling a slot the moment a replicate finishes. Nothing in
# this file decides how the cells are grouped: `workflow-experiment.ts plan` freezes the batches and
# emits both matrices as job outputs, so the dispatch cannot select a cell the plan did not freeze,
# or select one twice.
#
# What this replaced: a plan -> account -> round -> batch chain of nested reusable workflows, each
# level re-downloading the same frozen plan through its own checkout and workspace setup purely to
# read the next axis, and serialising rounds behind `max-parallel: 1` even between independent
# accounts. Run 34672199543 spent three sequential planning jobs per account before any sandbox
# existed and packed each provider's cells by count rather than by workload, so both of a provider's
# jobs reported suite `mixed` — which is what collided the Namespace credential mint. Per-account
# quota exclusion never lived at those levels anyway; it lives, and stays, on the bench job's
# `benchmark-account-<domain>` concurrency group.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated providers to benchmark (blank = every registered provider).'
        required: false
        type: string
        default: e2b,daytona-vm,blaxel,microsandbox-cloud,modal-gvisor,modal-vm,novita,runloop,namespace,vercel,runcloud
      suites:
        description: 'Comma-separated suites to run (blank = every registered suite). E.g. "network" for a targeted pre-merge run.'
        required: false
        type: string
        default: ''
      replicas:
        description: 'Replicate sandboxes per provider × suite cell — the between-machine axis (captures a provider fleet''s variation). Blank = each suite''s configured default (Suite.defaultReplicas); a whole number overrides every suite. Higher = tighter intervals at proportional runner cost; 1 = a quick single-sandbox pass.'
        required: false
        type: string
        default: ''
      pts_passes:
        description: 'Fixed PTS passes per case. Blank preserves fixed suite defaults; convergence requires a separate diagnostic run.'
        required: false
        type: string
        default: ''
      allow_branch:
        description: 'Allow benchmark cells on a non-main ref (publish remains main-only).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bench-matrix-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Freeze experiment
    if: >
      github.repository == 'starslingdev/hpc-sandbox-benchmarks' &&
      (github.ref == 'refs/heads/main' || inputs.allow_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      synthetic: ${{ steps.plan.outputs.synthetic }}
      realworld: ${{ steps.plan.outputs.realworld }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      # The CLI uploads the frozen plan itself (one immutable, run-scoped artifact), which needs the
      # artifact runtime GitHub gives only to action steps.
      - name: Expose artifact runtime to scripts
        uses: ./.github/actions/artifact-runtime
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_PROVIDERS: ${{ inputs.providers }}
          BENCH_SUITES: ${{ inputs.suites }}
          BENCH_REPLICAS: ${{ inputs.replicas }}
          BENCH_PTS_PASSES: ${{ inputs.pts_passes }}
          BENCH_ACCOUNT_CAPACITY: ${{ vars.BENCH_ACCOUNT_CAPACITY }}
          BENCH_ARTIFACT_E2B: ${{ vars.E2B_TEMPLATE }}
          BENCH_ARTIFACT_DAYTONA_VM: ${{ vars.DAYTONA_SNAPSHOT }}
          BENCH_ARTIFACT_DAYTONA_CONTAINER: ${{ vars.DAYTONA_CONTAINER_SNAPSHOT }}
          BENCH_ARTIFACT_VERCEL: ${{ vars.BENCH_ARTIFACT_VERCEL }}
        run: bun apps/cli/src/bin/workflow-experiment.ts plan

  # Wave 1 — the synthetic micro-benchmarks. Bounded PTS profiles, so these jobs are the short ones;
  # every provider starts at once and only providers sharing a vendor account queue behind each other.
  # A suite selection that plans no synthetic cell leaves the axis empty, which GitHub refuses to
  # expand, so the wave is skipped rather than failed.
  synthetic:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.synthetic != '[]'
    permissions:
      contents: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      # Deliberately NO max-parallel. Every provider's wave job is created at once, so they all reach
      # the `privileged` approval gate together and ONE approval releases the wave (GitHub approves
      # only the jobs already pending). Providers that share a vendor account then serialise on the
      # bench job's `benchmark-account-<domain>` queue, which is the only place a quota is enforced.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.synthetic) }}
    uses: ./.github/workflows/bench-suite.yml
    with:
      providers: ${{ toJSON(fromJSON(format('["{0}"]', matrix.provider))) }}
      suite: ${{ matrix.suite }}
      batch_id: ${{ matrix.batch }}
    secrets: inherit

  # Wave 2 — the real-world repository workloads (cold clone, install, build, test). An order of
  # magnitude longer per sandbox and more replicates each, so they run after the synthetic wave: a
  # provider's account cap cannot hold both waves at once anyway, and putting the cheap wave first
  # surfaces a broken plan, credential or image before the expensive one commits to it.
  #
  # `!cancelled()` rather than `success()`: a provider whose synthetic wave failed still runs its
  # real-world wave, because a partial experiment's evidence is what the coverage report is built from.
  realworld:
    name: ${{ matrix.suite }}
    needs: [plan, synthetic]
    if: >
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.realworld != '[]'
    permissions:
      contents: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.realworld) }}
    uses: ./.github/workflows/bench-suite.yml
    with:
      providers: ${{ toJSON(fromJSON(format('["{0}"]', matrix.provider))) }}
      suite: ${{ matrix.suite }}
      batch_id: ${{ matrix.batch }}
    secrets: inherit

  publish:
    name: Commit complete experiment
    needs: [plan, synthetic, realworld]
    if: >
      !cancelled() && needs.plan.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'starslingdev/hpc-sandbox-benchmarks'
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/commit-dataset.yml
    with:
      run_id: ${{ github.run_id }}
