name: Benchmark account (reusable)
on:
  workflow_call:
    inputs:
      account:
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      axis: ${{ steps.plan.outputs.axis }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Read frozen account axis
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_ACCOUNT: ${{ inputs.account }}
        run: bun apps/cli/src/bin/workflow-experiment.ts axes "$BENCH_ACCOUNT"
  execute:
    needs: plan
    permissions:
      contents: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: ${{ fromJSON(needs.plan.outputs.axis) }}
    uses: ./.github/workflows/bench-round.yml
    with:
      account: ${{ inputs.account }}
      round: ${{ matrix.round }}
    secrets: inherit
