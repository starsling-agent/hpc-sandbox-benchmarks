name: Toolchain image

# Build, validate, and publish the sandbox-benchmarks toolchain — staged as a release pipeline rather
# than one monolithic job. Two lanes:
#   • Pull requests — build the base (no push) and run the docker smoke. Fast gate, no credentials.
#   • Manual dispatch on main (GitHub Environment `privileged`) — the release phases: PLAN → BUILD
#     candidate → BAKE + verify each provider (a matrix, one cell per provider) → PROMOTE the validated
#     candidate to the immutable public :v1. Iteration never touches :v1; bump TOOLCHAIN_VERSION
#     (packages/schema/src/toolchain.ts) to publish a new version.
#
# Releases never fire on push/merge: only workflow_dispatch reaches the publish lane, and every
# credentialed job runs behind Environment `privileged` (reviewer approval) so the public cannot
# complete a release.
#
# Phase split (needs edges only where an artifact is required, so build/bake work runs in parallel and
# the ONLY serialized section is the promote transaction):
#
#   plan ──> build ──> bake (matrix: provider × required) ──> publish
#     │        │                                                  ▲
#     └── emits release-plan.json; every downstream job consumes  │
#         the plan (mode, refs, provider matrix, gates) rather    │
#         than re-reading the raw workflow inputs. ───────────────┘
#
# The plan also decides WHICH of those phases run, so a dispatch pays only for what it asked for. All
# four dispatch inputs are optional and their defaults reproduce the full release exactly:
#
#   providers  scope the whole lane to a subset (`vercel`). Only those matrix cells exist, and promote
#              becomes a BACKFILL: it publishes just those providers' version artifacts onto the
#              already-published version and never rewrites the public base or anyone else's artifact.
#              A scoped dispatch names what it wants, so every provider it names is REQUIRED.
#   build      `full` rebuilds the base (the default; what a version bump needs). `skip` skips the
#              build job outright and derives everything from what the registry already holds. A
#              scoped release is a backfill and therefore REQUIRES `skip`: its source is the PUBLISHED
#              base, so the new provider gets exactly the bytes the fleet already runs (the toolchain
#              build is not reproducible, so a rebuild would quietly hand it a different `:vN`).
#   promote    off ⇒ the publish job is skipped: bake + verify, look at the report, promote later.
#
# The canonical use is adding a provider to a version everyone else already runs — e.g. Runloop on v8:
#   1. providers=runloop, build=skip, promote=false → bake + verify a candidate Blueprint, nothing public
#   2. providers=runloop, build=skip, promote=true  → publish just the Runloop v8 Blueprint
# Neither dispatch runs the shared build job: Runloop derives its candidate/version Blueprints from
# the one already-published base during bake/promote.
#
# Cross-cutting GitHub Actions mechanics live in .github/actions/* composites (setup, ghcr login,
# input validation, package-visibility guard, summaries); provider bake/verify/promote logic lives in
# the package scripts under apps/cli (thin YAML, fat scripts). GHCR auth is the job's GITHUB_TOKEN; the
# only OIDC here is Namespace's GitHub federation (it has no stored secret), so the two jobs that boot a
# Namespace instance — `bake` (its namespace matrix cell) and `publish` (promote's re-validation) —
# each scope `id-token: write` to themselves. No other job requests an OIDC token.
on:
  # Manual publish (e.g. after bumping TOOLCHAIN_VERSION). The public version is immutable;
  # `force_republish` deliberately regenerates it over an existing version for fast dev iteration.
  # Normally, to republish you bump TOOLCHAIN_VERSION; an already-published version is skipped by the
  # plan phase unless force_republish is set.
  workflow_dispatch:
    inputs:
      providers:
        description: "Providers to build, verify and promote (comma-separated; blank = all)"
        type: string
        default: ""
      build:
        description: "Build: full (rebuild base) / skip (reuse registry; required when providers is scoped)"
        type: choice
        options: [full, skip]
        default: full
      promote:
        description: "Run the promote phase (uncheck to bake + verify only)"
        type: boolean
        default: true
      force_republish:
        description: "Regenerate the current version, overwriting it if already published (dev only)"
        type: boolean
        default: false
  pull_request:
    # Composite-action changes are exercised by toolchain-actions-smoke.yml on the standard
    # 2-vCPU runner. Keeping them out of this list matters: PR path filters use the whole PR diff,
    # so one setup-action edit would otherwise rebuild the PTS-heavy base after every later push.
    paths:
      - "packages/templates/**"
      - "packages/schema/src/toolchain.ts"
      - ".github/workflows/toolchain-image.yml"

# Serialize publishes by ref: concurrent dispatches on the same ref must not race on the version tag.
# PR runs key off their own head ref (separate group) and may cancel superseded runs; a publish is
# never cancelled (a half-published version is worse than a slow one).
concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege, global default: read-only. build and promote widen to packages: write; plan widens
# to packages: read (the immutability probe + package-visibility guard). bake needs no package scope
# (providers pull the public candidate anonymously) but, like publish, widens to id-token: write for
# Namespace's OIDC federation — scoped per-job, never at the workflow level (zizmor: excessive perms).
permissions:
  contents: read

env:
  # Only IMAGE_OWNER is consumed (ensure-package-public's `owner`). The former REGISTRY host is owned by
  # the ghcr-login composite default and imageRepo(), so it's not re-declared here.
  IMAGE_OWNER: starslingdev
  # The human-readable Vercel namespace every VCR ref is built from. Repository VARIABLES, not secrets:
  # a team slug and a project name are not credentials, and keeping them out of the secret store means
  # they stay readable in job logs when a mirror lands in the wrong repository.
  #
  # Unset vars materialize as "", which the providers config gatekeeper treats as unset and falls back
  # to the schema defaults — so this passthrough never has to repeat the default. That is deliberately
  # the opposite of a `|| 'fallback'` expression here: one default, owned by
  # packages/schema/src/toolchain.ts, instead of two that can drift.
  #
  # VERCEL_PROJECT_NAME must name the same project as the VERCEL_PROJECT_ID secret the CLI links with.
  VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
  VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}

jobs:
  # ── PR lane ──────────────────────────────────────────────────────────────────────────────────────
  # Fast PR gate: prove the base image still builds and the toolchain is complete, without pushing or
  # touching any provider. Uses the same shared smoke spec as the in-sandbox bake validation.
  #
  # Same-repo guard: this job checks out the PR head and runs scripts FROM that checkout (build.sh,
  # smoke.ts) on a self-hosted runner, so a fork PR could execute arbitrary code on the runner itself.
  # The repo is private (no untrusted forks today), but we gate on same-repo head as defense-in-depth
  # against a compromised account / outside-collaborator fork.
  pr-gate:
    name: Build base + docker smoke
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # 8 vCPUs, not the repo-standard 2: this job runs a real base-image build, whose dominant cost is
    # `phoronix-test-suite batch-install` compiling the benchmark profiles from source. That compile is
    # embarrassingly parallel (the PTS profile installers build with `make -j$(nproc)`), so it scales
    # with cores where the rest of the release — which only waits on registries and provider APIs — does
    # not. Only this job and `build` do local compute; the others stay on the 2-core standard. The 16-core
    # runner scaled the compile better still, but its queue times were prohibitive, so we run on 8.
    runs-on: starsling-ubuntu-24.04-8
    # Every job caps its wall time. The default is GitHub's 6-hour ceiling, and each of these jobs makes
    # calls that can hang rather than fail (a registry pull, a provider SDK, a remote builder) — a hang
    # would otherwise hold a self-hosted runner for hours. Sized to a few times the observed run.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Builds and smokes the image locally — no git push, so don't persist the job token.
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          buildx: "true"
      - name: Build base (no push) + docker smoke
        # Hand build.sh the job's own read-only token so mise's tool-release lookups hit GitHub's
        # authenticated rate limit (5000/h) instead of the anonymous 60/h that flakes the base build.
        # GITHUB_TOKEN is a built-in (not a custom secret), so this needs no `environment: privileged`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="$(bun packages/templates/src/pins.ts | sed -n 's/^IMAGE_NAME=//p')"
          bash packages/templates/images/build.sh
          # build.sh tags the base locally as ${name}:dev — smoke that, no registry involved. Generate
          # the script in its own assignment first so a non-zero exit of the generator fails the job
          # (not swallowed inside docker's command substitution, which would smoke an empty script).
          smoke_script="$(bun packages/templates/src/smoke.ts --bash)"
          docker run --rm "${name}:dev" bash -lc "$smoke_script"
      - name: Release summary
        if: always()
        uses: ./.github/actions/release-summary
        with:
          phase: pr-gate
          status: ${{ job.status }}
          mode: pr-gate
          source-ref: ${{ github.sha }}
          verify: bash packages/templates/images/build.sh

  # ── Release lane ─────────────────────────────────────────────────────────────────────────────────
  # PLAN: validate inputs/pins (credential-free), then resolve identity and emit ONE release plan that
  # every downstream job consumes. The plan decides `skip` (immutable version already published and not
  # force_republish) and the provider matrix. Emits release-plan.json as a diagnostic artifact.
  plan:
    name: Plan release
    # Dispatch-only release lane (no push trigger): confine the whole pipeline to a manual dispatch on
    # main of this repo. Every downstream job `needs` plan, so a skipped plan skips build/bake/publish too.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'starslingdev/hpc-sandbox-benchmarks'
    runs-on: starsling-ubuntu-24.04-2
    # Validation + one registry probe; it should take a minute. A hang means the registry is wedged.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      required: ${{ steps.plan.outputs.required }}
      # The RESOLVED provider scope (a blank `providers` input becomes the whole registry here), so the
      # jobs below read one shape: the promote `--provider` list, and the `contains()` guards that keep
      # a scoped run from doing a provider's credential dance for a provider it isn't releasing.
      providers: ${{ steps.plan.outputs.providers }}
      # The two dynamic job-skipping gates — see `build`'s and `publish`'s `if:` below.
      build-mode: ${{ steps.plan.outputs.build-mode }}
      run-build: ${{ steps.plan.outputs.run-build }}
      run-publish: ${{ steps.plan.outputs.run-publish }}
      size-tier: ${{ steps.plan.outputs.size-tier }}
      image-candidate: ${{ steps.plan.outputs.image-candidate }}
      # The GHCR base ref a vendor-registry mirror pulls: the PUBLISHED version on a backfill, the
      # mutable candidate otherwise. From the plan rather than the build job, because a backfill runs
      # no build job — and because only the plan knows the scope that decides which of the two it is.
      image-source: ${{ steps.plan.outputs.image-source }}
      toolchain-version: ${{ steps.plan.outputs.toolchain-version }}
      publish-target: ${{ steps.plan.outputs.publish-target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads code and probes the registry via docker/login — never git push.
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      # Fail-fast, credential-free: validate pins + the dispatch input BEFORE the registry login below.
      - name: Validate release inputs
        uses: ./.github/actions/release-validate-inputs
        with:
          force-republish: ${{ inputs.force_republish }}
          providers: ${{ inputs.providers }}
          build: ${{ inputs.build }}
          promote: ${{ inputs.promote }}
      # The one privileged step in plan: the immutability probe (`docker manifest inspect`) needs a
      # GHCR session. GITHUB_TOKEN with packages: read suffices.
      - name: GHCR session
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve identity & build release plan
        id: plan
        env:
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
          RELEASE_PROVIDERS: ${{ inputs.providers }}
          BUILD_MODE: ${{ inputs.build }}
          PROMOTE: ${{ inputs.promote }}
        # release-plan.ts validates pins again, probes whether :v1 is already published (best-effort —
        # promote does the authoritative guard), writes release-plan.json, and prints the key=value
        # outputs the downstream jobs read.
        # release-plan.ts writes the key=value outputs straight to $GITHUB_OUTPUT (not via a stdout
        # redirect), so a child process's stdout can never corrupt the outputs file.
        run: bun apps/cli/src/bin/release-plan.ts release-plan.json
      # Guard the candidate package visibility so providers can pull it anonymously (see the composite).
      # The plan lists EVERY anonymously-pulled package — the base plus each registry-served variant (the
      # vercel bake cell pulls its staged variant from GHCR with no login of its own) — so a variant
      # package that is still private surfaces here rather than as an opaque pull failure mid-bake.
      # Skipped when the release itself is skipped (version already published).
      - name: Ensure candidate packages are public
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/actions/ensure-package-public
        with:
          owner: ${{ env.IMAGE_OWNER }}
          package: ${{ steps.plan.outputs.packages }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ github.run_id }}
          path: release-plan.json
          if-no-files-found: warn
          # A "Re-run failed jobs" keeps github.run_id and only bumps run_attempt, so the artifact name
          # is unchanged; upload-artifact@v4+ fails a duplicate name by default. Overwrite so a re-run's
          # if:always() upload can't fail the job over a name that the first attempt already claimed.
          overwrite: true
      - name: Release summary
        if: always()
        uses: ./.github/actions/release-summary
        with:
          phase: plan
          status: ${{ job.status }}
          mode: ${{ steps.plan.outputs.mode }}
          scope: ${{ steps.plan.outputs.providers }}
          source-ref: ${{ github.sha }}
          image: ${{ steps.plan.outputs.image-candidate }}
          size-tier: ${{ steps.plan.outputs.size-tier }}
          published: ${{ steps.plan.outputs.publish-target }}
          diagnostics: release-plan-${{ github.run_id }}

  # BUILD: build the base image (+ provider variants) and push the mutable candidate base to GHCR ONCE, then
  # record its immutable digest. The providers below all fan out from this single pushed candidate.
  #
  # Dynamic job skipping #1: `build: skip` drops this job entirely (`run-build` is false), so a re-verify,
  # a promote of an already-staged candidate, or a scoped backfill onto a published version spends no
  # build at all. Everything downstream tolerates this job being skipped (see `bake`).
  build:
    name: Build + push candidate
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.run-build == 'true'
    # 8 vCPUs — the same compile-bound base-image build as pr-gate (see the note there), and it sits on
    # the critical path of every release: nothing bakes until the candidate is pushed.
    runs-on: starsling-ubuntu-24.04-8
    # The heavy phase: a full base-image build (apt, mise, the PTS install) plus the push.
    timeout-minutes: 60
    environment: privileged
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      # One ref: this phase stages exactly one image, the candidate base, which is also the base every
      # downstream phase pins. (It was two outputs while a `variants` build could stage per-provider
      # images on top of an untouched base.)
      base-digest-ref: ${{ steps.build.outputs.base-digest-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishes to GHCR via docker/login-action, never git push — don't persist the job token.
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          buildx: "true"
      - name: GHCR session
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push candidate image
        id: build
        env:
          BUILD_REF: ${{ github.sha }}
          BUILD_VERSION: ${{ needs.plan.outputs.toolchain-version }}
          # Same mise rate-limit fix as pr-gate: the release build runs the identical build.sh, so give
          # it the authenticated GitHub API limit too. Built-in token; this job is already privileged.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Declare then assign so the command substitution's exit status isn't masked (SC2155).
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_DATE
          # No `>> "$GITHUB_OUTPUT"` redirect: build.sh runs with inherited stdout, so redirecting this
          # command's stdout would splice its build log into the outputs file (GitHub would reject it).
          # build-candidate.ts writes the digest outputs straight to $GITHUB_OUTPUT itself.
          bun apps/cli/src/bin/build-candidate.ts build-metadata.json
      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metadata-${{ github.run_id }}
          path: build-metadata.json
          if-no-files-found: warn
          # See the plan upload: overwrite so a re-run (same run_id, new run_attempt) can't fail on a
          # duplicate artifact name.
          overwrite: true
      - name: Release summary
        if: always()
        uses: ./.github/actions/release-summary
        with:
          phase: build
          status: ${{ job.status }}
          mode: ${{ needs.plan.outputs.mode }}
          scope: ${{ needs.plan.outputs.providers }}
          source-ref: ${{ github.sha }}
          image: ${{ steps.build.outputs.base-digest-ref }}
          base-image: ${{ steps.build.outputs.base-digest-ref }}
          size-tier: ${{ needs.plan.outputs.size-tier }}
          verify: bun apps/cli/src/bin/build-candidate.ts
          diagnostics: build-metadata-${{ github.run_id }}

  # BAKE + verify: one matrix cell per provider (from the plan). Each cell bakes its candidate artifact
  # from the plan-selected base (the pushed candidate for a full release, published version for a
  # backfill) and validates it by booting a sandbox and running the shared smoke spec. fail-fast: false
  # so a flaky provider doesn't cancel the others' diagnostics — but ANY cell
  # that RAN and failed still fails this job (and, being a `needs`, blocks promote). Required cells
  # (plan `required`) additionally pass `--require`, so a missing/misnamed secret fails the cell instead
  # of silently skipping a provider the release must ship.
  #
  # The matrix comes from the plan, so a scoped dispatch simply produces fewer cells — there is no
  # per-cell `if:` to keep in sync with the scope, and an out-of-scope provider's job never exists.
  bake:
    name: Bake + verify (${{ matrix.provider }})
    needs: [plan, build]
    # `build` is skippable (`build: skip`), and a skipped `needs` would normally skip this job too — so
    # the condition is spelled out rather than left to the default. `!cancelled()` re-enables the job
    # after a skipped dependency, which then makes plan's own success something we must assert (a FAILED
    # plan emits no outputs, and `'' != 'true'` would have read as "don't skip"). build must have either
    # succeeded or been skipped on purpose; anything else means there is no candidate to bake.
    if: >
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.skip != 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.build.result)
    runs-on: starsling-ubuntu-24.04-2
    # Each cell boots a provider sandbox with that provider's secret — a credentialed job, so it runs
    # behind Environment `privileged` like the rest of the release lane.
    environment: privileged
    timeout-minutes: 60
    # Only the namespace cell uses id-token (Namespace's GitHub OIDC federation, no stored secret), but
    # GHA permissions are per-job, not per-cell — so it is scoped to the whole bake job and the other
    # cells simply never request a token. contents: read is the workflow default, re-declared so this
    # block widens rather than replaces. No packages scope: providers pull the public candidate anon.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Boots the just-baked candidate via provider SDKs — no git push, no ghcr push. Don't persist.
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      # Namespace has no stored secret: the shared action federates through GitHub OIDC and exposes
      # the same `namespace.outputs.token-file` contract in every managed lane. Keeping the producer
      # id/output identical is what lets provider metadata describe this input without lane-specific
      # generator exceptions. A failed federation still degrades to the normal missing-input skip.
      - name: Set up Namespace credentials
        # >>> generated: preauth-namespace-token-bake — bun run generate-provider-wiring
        if: matrix.provider == 'namespace'
        # <<< end generated: preauth-namespace-token-bake
        continue-on-error: true
        id: namespace
        uses: ./.github/actions/namespace-token
        with:
          token-name: sandbox-benchmarks-toolchain-bake-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Authenticate with Vercel and VCR
        # >>> generated: preauth-vercel-auth-bake — bun run generate-provider-wiring
        if: matrix.provider == 'vercel'
        # <<< end generated: preauth-vercel-auth-bake
        continue-on-error: true
        id: vercel-auth
        uses: ./.github/actions/vercel-auth
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vcr-login: "true"
      # Vercel Sandbox can only boot images from VCR, so the shared toolchain base is mirrored across
      # rather than pulled from GHCR like every other provider. It is the SAME base image the rest of
      # the fleet runs — Vercel injects its own session agent at boot, so there is no provider delta to
      # bake in and no separate GHCR image to keep in step.
      #
      # SOURCE_REF follows the same resolved source as every bake cell. A full build uses that job's
      # immutable output digest; a build-skipped backfill uses the plan's PUBLISHED version, while the
      # mutable candidate may already have moved toward the next release. Mirroring any other ref would
      # verify one image and ship another, and promote cannot catch it because Vercel's version artifact
      # is a retag of whatever was mirrored here. See releaseBaseTag().
      - name: Mirror the toolchain base into VCR
        if: matrix.provider == 'vercel' && steps.vercel-auth.outcome == 'success'
        id: vercel-vcr
        env:
          SOURCE_REF: ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }}
          # `vercel vcr push` is a CLI call, so it needs CLI credentials of its own — the vercel-auth
          # composite's docker login covers the REGISTRY, not the CLI, and its `--token` lives in that
          # composite's step env, which does not carry across steps. Without this the push dies with
          # "No existing credentials found", after the multi-GB pull above has already run.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          target_ref="$(bun -e 'import { config } from "@sandbox-benchmarks/providers"; console.log(config.vercelImageCandidate)')"
          project="$(bun -e 'import { config } from "@sandbox-benchmarks/providers"; console.log(config.vercelProjectName)')"
          target_name="${target_ref##*/}"
          echo ">>> mirroring $SOURCE_REF into VCR as $target_ref"
          docker pull "$SOURCE_REF"
          docker tag "$SOURCE_REF" "$target_ref"
          # --project pins the destination to the SAME resolved name the target ref was built from.
          # Without it the push silently follows whatever project VERCEL_PROJECT_ID linked, so a
          # mismatched VERCEL_PROJECT_NAME would tag one repository and publish into another — and the
          # digest read back below would describe an image the providers never pull.
          # --token explicitly rather than relying on the CLI's env pickup: one documented contract,
          # and it fails loudly here rather than silently falling back to some ambient session.
          ./node_modules/.bin/vercel vcr push docker "$target_name" --project "$project" --token="$VERCEL_TOKEN"
          digest="$(docker buildx imagetools inspect "$target_ref" --format '{{json .Manifest.Digest}}' | jq -er '.')"
          echo "digest-ref=${target_ref%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Log out of VCR after mirror
        if: matrix.provider == 'vercel' && steps.vercel-vcr.outcome == 'success'
        run: docker logout vcr.vercel.com
      - name: Bake + verify candidate
        id: bake
        # The cell's provider + full required set reach the script through the environment, never
        # interpolated into the shell, so a matrix value can't inject into the runner command. Provider
        # creds are optional: a missing one SKIPS that provider (required cells fail instead — see
        # --require below). blaxel gets no creds here (its bake is a no-op booting the stock base), so
        # it skips, exactly as the previous monolithic lane did.
        #
        # Each cell is handed ONLY its own provider's credentials. The cell already restricts execution
        # to one provider (`--provider`), so injecting every provider secret into every cell would hand
        # a compromised dependency in any one cell every other provider's key for no benefit. Scoping
        # them here is what makes the fan-out least-privilege rather than just concurrent.
        env:
          PROVIDER: ${{ matrix.provider }}
          REQUIRED_PROVIDERS: ${{ needs.plan.outputs.required }}
          # Pin every cell to the one base selected by the release plan. A full build supplies its
          # immutable output digest; a build-skipped scoped backfill supplies the published version,
          # never the mutable candidate that may already contain the next release's bytes.
          BASE_IMAGE_REF: ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }}
          # >>> generated: provider-inputs-bake — bun run generate-provider-wiring
          E2B_API_KEY: ${{ matrix.provider == 'e2b' && secrets.E2B_API_KEY || '' }}
          E2B_TEMPLATE: ${{ matrix.provider == 'e2b' && (env.E2B_TEMPLATE || vars.E2B_TEMPLATE || secrets.E2B_TEMPLATE) || '' }}
          DAYTONA_API_KEY: ${{ (matrix.provider == 'daytona-vm' || matrix.provider == 'daytona-container') && secrets.DAYTONA_API_KEY || '' }}
          DAYTONA_TARGET: ${{ matrix.provider == 'daytona-vm' && (env.DAYTONA_TARGET || vars.DAYTONA_TARGET || secrets.DAYTONA_TARGET || 'us-west-2') || '' }}
          DAYTONA_SNAPSHOT: ${{ matrix.provider == 'daytona-vm' && (env.DAYTONA_SNAPSHOT || vars.DAYTONA_SNAPSHOT || secrets.DAYTONA_SNAPSHOT) || '' }}
          DAYTONA_CONTAINER_TARGET: ${{ matrix.provider == 'daytona-container' && (env.DAYTONA_CONTAINER_TARGET || vars.DAYTONA_CONTAINER_TARGET || secrets.DAYTONA_CONTAINER_TARGET || 'us-west-2') || '' }}
          DAYTONA_CONTAINER_SNAPSHOT: ${{ matrix.provider == 'daytona-container' && (env.DAYTONA_CONTAINER_SNAPSHOT || vars.DAYTONA_CONTAINER_SNAPSHOT || secrets.DAYTONA_CONTAINER_SNAPSHOT) || '' }}
          BL_API_KEY: ${{ matrix.provider == 'blaxel' && secrets.BL_API_KEY || '' }}
          BL_WORKSPACE: ${{ matrix.provider == 'blaxel' && secrets.BL_WORKSPACE || '' }}
          MICROSANDBOX_LOCAL_BENCH: ${{ matrix.provider == 'microsandbox-local' && '1' || '' }}
          MSB_API_KEY: ${{ matrix.provider == 'microsandbox-cloud' && secrets.MSB_API_KEY || '' }}
          MSB_API_URL: ${{ matrix.provider == 'microsandbox-cloud' && (env.MSB_API_URL || vars.MSB_API_URL || secrets.MSB_API_URL) || '' }}
          MODAL_TOKEN_ID: ${{ (matrix.provider == 'modal-gvisor' || matrix.provider == 'modal-vm') && secrets.MODAL_TOKEN_ID || '' }}
          MODAL_TOKEN_SECRET: ${{ (matrix.provider == 'modal-gvisor' || matrix.provider == 'modal-vm') && secrets.MODAL_TOKEN_SECRET || '' }}
          NOVITA_API_KEY: ${{ matrix.provider == 'novita' && secrets.NOVITA_API_KEY || '' }}
          NOVITA_TEMPLATE: ${{ matrix.provider == 'novita' && (env.NOVITA_TEMPLATE || vars.NOVITA_TEMPLATE || secrets.NOVITA_TEMPLATE) || '' }}
          RUNLOOP_API_KEY: ${{ matrix.provider == 'runloop' && secrets.RUNLOOP_API_KEY || '' }}
          RUNLOOP_BLUEPRINT: ${{ matrix.provider == 'runloop' && (env.RUNLOOP_BLUEPRINT || vars.RUNLOOP_BLUEPRINT || secrets.RUNLOOP_BLUEPRINT) || '' }}
          NSC_TOKEN_FILE: ${{ steps.namespace.outputs.token-file }}
          VERCEL_OIDC_TOKEN: ${{ matrix.provider == 'vercel' && steps.vercel-auth.outcome == 'success' && env.VERCEL_OIDC_TOKEN || '' }}
          VERCEL_TEAM_SLUG: ${{ matrix.provider == 'vercel' && (env.VERCEL_TEAM_SLUG || vars.VERCEL_TEAM_SLUG || secrets.VERCEL_TEAM_SLUG) || '' }}
          VERCEL_PROJECT_NAME: ${{ matrix.provider == 'vercel' && (env.VERCEL_PROJECT_NAME || vars.VERCEL_PROJECT_NAME || secrets.VERCEL_PROJECT_NAME) || '' }}
          RUN_CLOUD_API_KEY: ${{ matrix.provider == 'runcloud' && secrets.RUN_CLOUD_API_KEY || '' }}
          TAMA_TOKEN: ${{ matrix.provider == 'tama' && secrets.TAMA_TOKEN || '' }}
          TAMA_CLI: ${{ matrix.provider == 'tama' && (env.TAMA_CLI || vars.TAMA_CLI || secrets.TAMA_CLI) || '' }}
          # <<< end generated: provider-inputs-bake
          VERCEL_CANDIDATE_IMAGE: ${{ steps.vercel-vcr.outcome == 'success' && steps.vercel-vcr.outputs.digest-ref || '' }}
        run: |
          set -euo pipefail
          # Route the report JSON to a file via env (not a `> file` redirect): the provider CLIs inherit
          # stdout, so a redirect would splice their chatter into the report. bake.ts writes the file
          # even when it exits non-zero, so it's a clean diagnostic on failure too.
          export BAKE_REPORT_FILE="bake-${PROVIDER}.json"
          # Every cell receives the same release policy. bake.ts scopes the missing-required check to
          # this cell, emits a real Actions warning for a best-effort failure, and exits non-zero only
          # for a blocking outcome. Keeping the policy in TypeScript avoids a shell-level exit swallow.
          bun apps/cli/src/bin/bake.ts \
            --provider "${PROVIDER}" \
            --base-image "${BASE_IMAGE_REF}" \
            --require "${REQUIRED_PROVIDERS}"
      # Failure-safe fallback for auth/mirror failures that skip the immediate post-mirror logout.
      - name: Ensure VCR logout
        if: always()
        run: docker logout vcr.vercel.com || true
      - name: Upload bake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bake-${{ matrix.provider }}-${{ github.run_id }}
          path: bake-${{ matrix.provider }}.json
          if-no-files-found: warn
          # See the plan upload: overwrite so re-running a single failed cell (same run_id) can't fail on
          # its own first-attempt artifact — the whole point of the per-cell re-run.
          overwrite: true
      - name: Release summary
        if: always()
        uses: ./.github/actions/release-summary
        with:
          phase: ${{ matrix.provider }}/bake
          status: ${{ job.status }}
          mode: ${{ needs.plan.outputs.mode }}
          scope: ${{ needs.plan.outputs.providers }}
          source-ref: ${{ github.sha }}
          # The build job may have been skipped (`build: skip`), leaving its outputs empty — fall back
          # to the plan's source (the published version for a scoped backfill, candidate otherwise).
          image: ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }}
          base-image: ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }}
          provider-target: ${{ matrix.provider }}
          size-tier: ${{ needs.plan.outputs.size-tier }}
          verify: bun apps/cli/src/bin/bake.ts --provider ${{ matrix.provider }} --base-image ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }} --require ${{ needs.plan.outputs.required }}
          diagnostics: bake-${{ matrix.provider }}-${{ github.run_id }}
          required: ${{ needs.plan.outputs.required }}
          report: bake-${{ matrix.provider }}.json

  # PROMOTE: the serialized publication barrier and the ONLY job that mutates the public :v1. Runs only
  # after every bake cell converges (a failed required cell fails `bake` and blocks this via `needs`).
  # promote re-validates the candidate (TOCTOU: the candidate tag is mutable), builds each provider's
  # version-named artifact FROM the revalidated bytes, then retags the base → :v1 LAST as the commit
  # point. `--require` (from the plan) fails the promote before publish if a required provider's version
  # artifact was skipped/failed. `--force` (force_republish only) regenerates an existing version.
  # `--provider` (from the plan) scopes the transaction; a SUBSET makes it a backfill that publishes only
  # those providers' version artifacts onto the existing version and never writes the base at all.
  # The release job (named `publish` — the drift gate requires this name for the GHCR release lane).
  #
  # Dynamic job skipping #2: `promote: false` drops this job (`run-publish`), so a dispatch can stage and
  # verify a candidate, leave the public surface untouched, and promote from a later dispatch.
  publish:
    name: Promote candidate → version
    needs: [plan, build, bake]
    # The only job that mutates the public :v1. Confine it to a manual dispatch on main of this repo
    # (redundant with plan's gate, but the hardening gate asserts this literally on the publish job).
    # Same `!cancelled()` shape as `bake` (build is skippable), so each dependency is asserted by hand:
    # plan must have succeeded, bake must be green (a failed required cell blocks the release), and
    # build must have either succeeded or been deliberately skipped.
    if: >
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.bake.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.build.result) &&
      needs.plan.outputs.skip != 'true' &&
      needs.plan.outputs.run-publish == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'starslingdev/hpc-sandbox-benchmarks'
    runs-on: starsling-ubuntu-24.04-2
    environment: privileged
    # Re-validates and promotes every in-scope provider SERIALLY (it is a transaction, not a fan-out),
    # so at full scope it is the longest-running credentialed job. Sized for that worst case; a scoped
    # backfill finishes in a fraction of it.
    timeout-minutes: 60
    # packages: write retags the base → public :v1. id-token: write is Namespace's OIDC federation for
    # the re-validation boot (no stored secret) — scoped here, not at the workflow level (zizmor).
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishes to GHCR via docker/login-action, never git push — don't persist the job token.
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          buildx: "true"
      - name: GHCR session
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Namespace federates through GitHub OIDC with no stored secret. Promote is a serial transaction,
      # so the shared action runs once when Namespace is in scope and gives this lane the same
      # `namespace.outputs.token-file` contract as validation and benchmarks. continue-on-error keeps
      # Namespace best-effort; the scope test uses matrix element equality because string contains
      # would also match a future provider id that merely contains `namespace`.
      - name: Set up Namespace credentials
        # >>> generated: preauth-namespace-token-promote — bun run generate-provider-wiring
        if: contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'namespace')
        # <<< end generated: preauth-namespace-token-promote
        continue-on-error: true
        id: namespace
        uses: ./.github/actions/namespace-token
        with:
          token-name: sandbox-benchmarks-toolchain-promote-${{ github.run_id }}-${{ github.run_attempt }}
      # Same scope gate as the Namespace mint above: a release that isn't promoting vercel has no reason
      # to pull a project OIDC token or log docker into VCR.
      - name: Authenticate with Vercel and VCR
        # >>> generated: preauth-vercel-auth-promote — bun run generate-provider-wiring
        if: contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'vercel')
        # <<< end generated: preauth-vercel-auth-promote
        continue-on-error: true
        id: vercel-auth
        uses: ./.github/actions/vercel-auth
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vcr-login: "true"
      - name: Log in to VCR and pin candidate
        if: steps.vercel-auth.outcome == 'success'
        id: vercel-vcr
        run: |
          set -euo pipefail
          candidate="$(bun -e 'import { config } from "@sandbox-benchmarks/providers"; console.log(config.vercelImageCandidate)')"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest.Digest}}' | jq -er '.')"
          echo "digest-ref=${candidate%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Promote candidate → version
        id: promote
        env:
          REQUIRED: ${{ needs.plan.outputs.required }}
          # The resolved scope, always passed (never the raw dispatch input): for a full release it is
          # simply every registered provider and `--provider` is a no-op, and for a scoped one it is what
          # makes the promote a backfill. bake.ts derives "partial" from the list length, so the
          # subset-vs-everything decision has exactly one owner.
          RELEASE_PROVIDERS: ${{ needs.plan.outputs.providers }}
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
          # Route the promote payload JSON to a file via env (not a `> file` redirect): the provider
          # CLIs inherit stdout, so a redirect would splice their chatter into the payload. bake.ts
          # writes the file even when promote aborts (it records the structured reports before exiting).
          BAKE_REPORT_FILE: promote-payload.json
          # >>> generated: provider-inputs-promote — bun run generate-provider-wiring
          E2B_API_KEY: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'e2b') && secrets.E2B_API_KEY || '' }}
          E2B_TEMPLATE: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'e2b') && (env.E2B_TEMPLATE || vars.E2B_TEMPLATE || secrets.E2B_TEMPLATE) || '' }}
          DAYTONA_API_KEY: ${{ (contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'daytona-vm') || contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'daytona-container')) && secrets.DAYTONA_API_KEY || '' }}
          DAYTONA_TARGET: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'daytona-vm') && (env.DAYTONA_TARGET || vars.DAYTONA_TARGET || secrets.DAYTONA_TARGET || 'us-west-2') || '' }}
          DAYTONA_SNAPSHOT: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'daytona-vm') && (env.DAYTONA_SNAPSHOT || vars.DAYTONA_SNAPSHOT || secrets.DAYTONA_SNAPSHOT) || '' }}
          DAYTONA_CONTAINER_TARGET: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'daytona-container') && (env.DAYTONA_CONTAINER_TARGET || vars.DAYTONA_CONTAINER_TARGET || secrets.DAYTONA_CONTAINER_TARGET || 'us-west-2') || '' }}
          DAYTONA_CONTAINER_SNAPSHOT: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'daytona-container') && (env.DAYTONA_CONTAINER_SNAPSHOT || vars.DAYTONA_CONTAINER_SNAPSHOT || secrets.DAYTONA_CONTAINER_SNAPSHOT) || '' }}
          BL_API_KEY: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'blaxel') && secrets.BL_API_KEY || '' }}
          BL_WORKSPACE: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'blaxel') && secrets.BL_WORKSPACE || '' }}
          MICROSANDBOX_LOCAL_BENCH: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'microsandbox-local') && '1' || '' }}
          MSB_API_KEY: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'microsandbox-cloud') && secrets.MSB_API_KEY || '' }}
          MSB_API_URL: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'microsandbox-cloud') && (env.MSB_API_URL || vars.MSB_API_URL || secrets.MSB_API_URL) || '' }}
          MODAL_TOKEN_ID: ${{ (contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'modal-gvisor') || contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'modal-vm')) && secrets.MODAL_TOKEN_ID || '' }}
          MODAL_TOKEN_SECRET: ${{ (contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'modal-gvisor') || contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'modal-vm')) && secrets.MODAL_TOKEN_SECRET || '' }}
          NOVITA_API_KEY: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'novita') && secrets.NOVITA_API_KEY || '' }}
          NOVITA_TEMPLATE: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'novita') && (env.NOVITA_TEMPLATE || vars.NOVITA_TEMPLATE || secrets.NOVITA_TEMPLATE) || '' }}
          RUNLOOP_API_KEY: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'runloop') && secrets.RUNLOOP_API_KEY || '' }}
          RUNLOOP_BLUEPRINT: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'runloop') && (env.RUNLOOP_BLUEPRINT || vars.RUNLOOP_BLUEPRINT || secrets.RUNLOOP_BLUEPRINT) || '' }}
          NSC_TOKEN_FILE: ${{ steps.namespace.outputs.token-file }}
          VERCEL_OIDC_TOKEN: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'vercel') && steps.vercel-auth.outcome == 'success' && env.VERCEL_OIDC_TOKEN || '' }}
          VERCEL_TEAM_SLUG: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'vercel') && (env.VERCEL_TEAM_SLUG || vars.VERCEL_TEAM_SLUG || secrets.VERCEL_TEAM_SLUG) || '' }}
          VERCEL_PROJECT_NAME: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'vercel') && (env.VERCEL_PROJECT_NAME || vars.VERCEL_PROJECT_NAME || secrets.VERCEL_PROJECT_NAME) || '' }}
          RUN_CLOUD_API_KEY: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'runcloud') && secrets.RUN_CLOUD_API_KEY || '' }}
          TAMA_TOKEN: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'tama') && secrets.TAMA_TOKEN || '' }}
          TAMA_CLI: ${{ contains(fromJSON(needs.plan.outputs.matrix).include.*.provider, 'tama') && (env.TAMA_CLI || vars.TAMA_CLI || secrets.TAMA_CLI) || '' }}
          # <<< end generated: provider-inputs-promote
          VERCEL_CANDIDATE_IMAGE: ${{ steps.vercel-vcr.outcome == 'success' && steps.vercel-vcr.outputs.digest-ref || '' }}
        run: |
          set -euo pipefail
          args=(--promote --require "${REQUIRED}" --provider "${RELEASE_PROVIDERS}")
          # --force (manual force_republish dispatch only) republishes over an existing immutable
          # version; never set on the automated push path. bake.ts refuses --force on a scoped promote,
          # and release-validate rejects the combination before the release spends anything.
          if [ "${FORCE_REPUBLISH}" = "true" ]; then args+=(--force); fi
          bun apps/cli/src/bin/bake.ts "${args[@]}"
      - name: Log out of VCR
        if: always()
        run: docker logout vcr.vercel.com || true
      - name: Upload promote payload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promote-payload-${{ github.run_id }}
          path: promote-payload.json
          if-no-files-found: warn
          # See the plan upload: overwrite so a re-run (same run_id, new run_attempt) can't fail on a
          # duplicate artifact name.
          overwrite: true
      - name: Release summary
        if: always()
        uses: ./.github/actions/release-summary
        with:
          phase: publish
          status: ${{ job.status }}
          mode: ${{ needs.plan.outputs.mode }}
          scope: ${{ needs.plan.outputs.providers }}
          source-ref: ${{ github.sha }}
          # Empty when the build job was skipped (`build: skip`) — fall back to the same plan-selected
          # source the partial promote re-validates (published version for a backfill, candidate otherwise).
          image: ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }}
          base-image: ${{ needs.build.outputs.base-digest-ref || needs.plan.outputs.image-source }}
          size-tier: ${{ needs.plan.outputs.size-tier }}
          verify: bun apps/cli/src/bin/bake.ts --promote --require ${{ needs.plan.outputs.required }} --provider ${{ needs.plan.outputs.providers }}${{ inputs.force_republish && ' --force' || '' }}
          published: ${{ needs.plan.outputs.publish-target }}
          diagnostics: promote-payload-${{ github.run_id }}
          required: ${{ needs.plan.outputs.required }}
          report: promote-payload.json
