name: Benchmark suite (reusable)

# The ONE benchmark cell in this repository: every dispatch lane reaches a sandbox through here, so
# the provider credential wiring, the runner routing, the job budget and the evidence upload exist
# exactly once. It executes one frozen batch — a whole wave of one provider — as a pool bounded by
# that provider's account sandbox cap.

on:
  workflow_call:
    inputs:
      providers:
        description: 'JSON array holding the one provider id this batch belongs to (the frozen plan''s wave axis).'
        required: true
        type: string
      suite:
        description: 'The batch label used in job names, evidence names and the credential mint: a registered SUITE_NAMES value when the wave is one suite, otherwise the wave (`synthetic` / `realworld`).'
        required: true
        type: string
      batch_id:
        description: 'Immutable experiment batch identity. The only identity that is unique per job, so anything a job must not share with a sibling is keyed on it.'
        type: string
        required: true

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  bench:
    concurrency:
      # >>> generated: provider-account-group-bench — bun run generate-provider-wiring
      group: benchmark-account-${{ (matrix.provider == 'daytona-vm' || matrix.provider == 'daytona-container') && 'daytona' || (matrix.provider == 'modal-gvisor' || matrix.provider == 'modal-vm') && 'modal' || matrix.provider }}
      # <<< end generated: provider-account-group-bench
      cancel-in-progress: false
      queue: max
    name: ${{ matrix.provider }}
    environment: privileged
    # >>> generated: provider-runner — bun run generate-provider-wiring
    runs-on: ${{ 'ubuntu-24.04' }}
    # <<< end generated: provider-runner
    # BENCH_JOB_CEILING_MINUTES (packages/schema/src/suites.ts) — the same number the planner sizes a
    # batch against, hand-copied here because `timeout-minutes` cannot read an expression context and
    # re-checked against the frozen budget by the run step below. It covers the worst case a POOLED
    # batch can hold: two generations of the 150-minute real-world cell, 30 minutes clear of the
    # 360-minute maximum Actions allows a hosted job.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          # >>> generated: provider-runner-cache — bun run generate-provider-wiring
          no-cache: ${{ false && 'true' || 'false' }}
          # <<< end generated: provider-runner-cache

      # Each attempt's evidence is uploaded by the CLI as soon as that attempt ends (durable per
      # attempt, not only at job end), which needs the artifact runtime GitHub gives only to action
      # steps. The diagnostic bundle below still goes through actions/upload-artifact.
      - name: Expose artifact runtime to scripts
        uses: ./.github/actions/artifact-runtime

      # Named on the BATCH, which is the only identity unique to this job. Naming it on the suite made
      # both of a provider's jobs mint `...-mixed-<run>-<attempt>` in run 34672199543; the second was
      # refused `AlreadyExists`, and because the step tolerated its own failure the batch went on to
      # fail all 30 cells with `NSC_TOKEN_FILE must be a string (was missing)`. An unusable credential
      # is now a red step with the provider's own error in it, not thirty derived ones.
      - name: Set up Namespace credentials
        # >>> generated: preauth-namespace-token-bench — bun run generate-provider-wiring
        if: matrix.provider == 'namespace'
        # <<< end generated: preauth-namespace-token-bench
        id: namespace
        uses: ./.github/actions/namespace-token
        with:
          token-name: sandbox-benchmarks-${{ inputs.batch_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up the tama CLI
        if: matrix.provider == 'tama'
        uses: ./.github/actions/setup-tama

      # Also fails the job outright: an unauthenticated Vercel cell can only produce a batch of
      # identical create failures, and the OIDC error itself is the useful evidence.
      - name: Authenticate with Vercel
        # >>> generated: preauth-vercel-auth-bench — bun run generate-provider-wiring
        if: matrix.provider == 'vercel'
        # <<< end generated: preauth-vercel-auth-bench
        id: vercel-auth
        uses: ./.github/actions/vercel-auth
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run suite and normalize
        env:
          BENCH_REPO_REF: ${{ github.sha }}
          BENCH_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCH_PROVIDER: ${{ matrix.provider }}
          BENCH_CELL_BUDGET_MINUTES: '330'
          BENCH_BATCH_ID: ${{ inputs.batch_id }}
          GH_TOKEN: ${{ github.token }}
          # >>> generated: provider-inputs-bench — bun run generate-provider-wiring
          E2B_API_KEY: ${{ matrix.provider == 'e2b' && secrets.E2B_API_KEY || '' }}
          E2B_TEMPLATE: ${{ matrix.provider == 'e2b' && (env.E2B_TEMPLATE || vars.E2B_TEMPLATE || secrets.E2B_TEMPLATE) || '' }}
          DAYTONA_API_KEY: ${{ (matrix.provider == 'daytona-vm' || matrix.provider == 'daytona-container') && secrets.DAYTONA_API_KEY || '' }}
          DAYTONA_TARGET: ${{ matrix.provider == 'daytona-vm' && (env.DAYTONA_TARGET || vars.DAYTONA_TARGET || secrets.DAYTONA_TARGET || 'us-west-2') || '' }}
          DAYTONA_SNAPSHOT: ${{ matrix.provider == 'daytona-vm' && (env.DAYTONA_SNAPSHOT || vars.DAYTONA_SNAPSHOT || secrets.DAYTONA_SNAPSHOT) || '' }}
          DAYTONA_CONTAINER_TARGET: ${{ matrix.provider == 'daytona-container' && (env.DAYTONA_CONTAINER_TARGET || vars.DAYTONA_CONTAINER_TARGET || secrets.DAYTONA_CONTAINER_TARGET || 'us-west-2') || '' }}
          DAYTONA_CONTAINER_SNAPSHOT: ${{ matrix.provider == 'daytona-container' && (env.DAYTONA_CONTAINER_SNAPSHOT || vars.DAYTONA_CONTAINER_SNAPSHOT || secrets.DAYTONA_CONTAINER_SNAPSHOT) || '' }}
          BL_API_KEY: ${{ matrix.provider == 'blaxel' && secrets.BL_API_KEY || '' }}
          BL_WORKSPACE: ${{ matrix.provider == 'blaxel' && secrets.BL_WORKSPACE || '' }}
          MSB_API_KEY: ${{ matrix.provider == 'microsandbox-cloud' && secrets.MSB_API_KEY || '' }}
          MSB_API_URL: ${{ matrix.provider == 'microsandbox-cloud' && (env.MSB_API_URL || vars.MSB_API_URL || secrets.MSB_API_URL) || '' }}
          MODAL_TOKEN_ID: ${{ (matrix.provider == 'modal-gvisor' || matrix.provider == 'modal-vm') && secrets.MODAL_TOKEN_ID || '' }}
          MODAL_TOKEN_SECRET: ${{ (matrix.provider == 'modal-gvisor' || matrix.provider == 'modal-vm') && secrets.MODAL_TOKEN_SECRET || '' }}
          NOVITA_API_KEY: ${{ matrix.provider == 'novita' && secrets.NOVITA_API_KEY || '' }}
          NOVITA_TEMPLATE: ${{ matrix.provider == 'novita' && (env.NOVITA_TEMPLATE || vars.NOVITA_TEMPLATE || secrets.NOVITA_TEMPLATE) || '' }}
          RUNLOOP_API_KEY: ${{ matrix.provider == 'runloop' && secrets.RUNLOOP_API_KEY || '' }}
          RUNLOOP_BLUEPRINT: ${{ matrix.provider == 'runloop' && (env.RUNLOOP_BLUEPRINT || vars.RUNLOOP_BLUEPRINT || secrets.RUNLOOP_BLUEPRINT) || '' }}
          NSC_TOKEN_FILE: ${{ steps.namespace.outputs.token-file }}
          VERCEL_OIDC_TOKEN: ${{ matrix.provider == 'vercel' && steps.vercel-auth.outcome == 'success' && env.VERCEL_OIDC_TOKEN || '' }}
          VERCEL_TEAM_SLUG: ${{ matrix.provider == 'vercel' && (env.VERCEL_TEAM_SLUG || vars.VERCEL_TEAM_SLUG || secrets.VERCEL_TEAM_SLUG) || '' }}
          VERCEL_PROJECT_NAME: ${{ matrix.provider == 'vercel' && (env.VERCEL_PROJECT_NAME || vars.VERCEL_PROJECT_NAME || secrets.VERCEL_PROJECT_NAME) || '' }}
          RUN_CLOUD_API_KEY: ${{ matrix.provider == 'runcloud' && secrets.RUN_CLOUD_API_KEY || '' }}
          TAMA_TOKEN: ${{ matrix.provider == 'tama' && secrets.TAMA_TOKEN || '' }}
          TAMA_CLI: ${{ matrix.provider == 'tama' && (env.TAMA_CLI || vars.TAMA_CLI || secrets.TAMA_CLI) || '' }}
          # <<< end generated: provider-inputs-bench
          # >>> generated: provider-runner-lifetime — bun run generate-provider-wiring
          BENCH_RUNNER_LIFETIME_MINUTES: ${{ '' }}
          # <<< end generated: provider-runner-lifetime
        run: bun apps/cli/src/bin/workflow-experiment.ts execute

      # Each attempt is already uploaded individually by the CLI as it ends; this is the whole-batch
      # bundle. `warn`, not `error`: a setup step that fails before the executor runs (a refused
      # credential mint, a failed checkout) legitimately leaves no attempts behind, and a second red
      # step there would bury the real one. Nothing about completeness rests on this upload —
      # aggregation refuses to publish from the per-attempt evidence, not from this bundle.
      - name: Upload Run + raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-${{ inputs.batch_id }}-${{ matrix.provider }}-attempt-${{ github.run_attempt }}-${{ github.run_id }}
          path: experiment/attempts/
          if-no-files-found: warn
