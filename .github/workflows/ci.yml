name: CI

# Runs the README's command contract on every PR (and every push to main): the browser-free local
# checks must pass before code can merge, alongside a `figures` job that runs the Chrome-backed
# screenshot suite on a hosted runner with the pinned browser.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref — a new push cancels the previous, still-running CI for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads the checked-out code.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test & spell
    runs-on: starsling-ubuntu-24.04-2
    # The runner is self-hosted, so never execute untrusted fork-PR code on it: run only for
    # pushes and pull requests whose head is this same repository (fork PRs are skipped).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Third-party actions are pinned to a commit SHA (the tag comment is for humans only) so a
      # moved/compromised tag can't silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate only reads code (it never pushes), so don't leave the job token in .git/config.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to the toolchain version the repo develops against.
          bun-version: 1.4.0
          # This runner's setup-bun cache restores without a working ~/.bun/bin/bun, so a cache hit
          # fails the "Set up Bun" step. Always download bun fresh instead of restoring the cache.
          no-cache: true

      # Installs the version-pinned tools from mise.toml (typos) with checksum verification, and
      # caches them. mise itself is version-pinned for reproducibility.
      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.11
          install: true
          cache: true

      # Frozen lockfile: fail if package.json and bun.lock have drifted. --ignore-scripts so CI
      # runs zero lifecycle scripts, matching bunfig.toml's supply-chain posture (minimumReleaseAge,
      # no third-party postinstalls).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Biome gate — `biome check . --error-on-warnings`; warnings fail the build.
      - name: Lint (Biome)
        run: bun run lint

      # Shell + Dockerfile gates for the toolchain images (packages/templates/images). shellcheck and
      # hadolint are version-pinned in mise.toml and installed by the mise step above.
      - name: Lint shell (shellcheck)
        run: bun run lint:shell

      - name: Lint Dockerfiles (hadolint)
        run: bun run lint:docker

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Catalog drift gate — re-run the PTS catalog generator against the vendored profiles and fail
      # if the committed pts-generated.ts drifts (un-regenerated profile bump or a hand edit). Diffs
      # pts-generated.ts only; pts-overrides.ts curation is excluded.
      - name: Catalog drift
        run: bun run check:catalog-drift

      # Provider registry drift gate — the tuple owns identity, provider files own metadata, and the
      # generated correlated index must be the exact mechanical join of the two.
      - name: Provider registry drift
        run: bun run check:provider-registry-drift

      # Provider wiring drift gate — metadata owns provider inputs/runner/pre-auth declarations;
      # committed workflow, local-env, docs, and setup regions are reviewed generated projections.
      - name: Provider wiring drift
        run: bun run check:provider-wiring

      # Spelling gate — typos (pinned in mise.toml); misspellings fail the build.
      - name: Spell (typos)
        run: bun run spell

  # The Chrome-backed figures suite, kept out of `check` because it cannot share that job's runner:
  # `starsling-ubuntu-24.04-2` runs the job as root, and Chrome refuses to start its sandbox as root
  # ("Running as root without --no-sandbox is not supported"). Dropping the sandbox to fit the runner
  # is the one thing setup-pinned-chrome exists to prevent, so the suite runs on the same HOSTED
  # ubuntu-24.04 image update-leaderboard renders on — the environment that action is written for,
  # and the one whose pinned browser produces the committed figures' bytes.
  figures:
    name: Figures screenshot (pinned Chrome)
    runs-on: ubuntu-24.04
    # Same fork-PR posture as `check`: this gate runs only for pushes and same-repo pull requests.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # setup-pinned-chrome reads the installed playwright-core to resolve its pin, so the install
      # must precede it. --ignore-scripts keeps CI's zero-lifecycle-script posture: the browser is
      # downloaded by the action, explicitly, and never by a postinstall.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up pinned headless Chrome
        uses: ./.github/actions/setup-pinned-chrome

      - name: Test figures screenshot
        run: bun run test:figures
